# 실습 3. 클러스터 안에서 curl 을 쳐 볼 파드 (curl 만 들어 있는 진짜 파드, 역할만 '부르는 쪽')
apiVersion: v1
kind: Pod
metadata:
  name: curl
spec:
  terminationGracePeriodSeconds: 1   # 지울 때 30초 기다리지 않게
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      command: ["sleep", "36000"]     # 아무 일도 안 하고 떠 있기만 한다. 우리가 exec 로 들어가서 쓴다

# 실습 5. 종합 수리 — 어딘가 두 군데가 망가져 있습니다
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
data:
  APP_GREETING: welcome to shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - name: shop
          image: 844171074409.dkr.ecr.ap-northeast-2.amazonaws.com/k8s-study/demo-app:1.0
          ports:
            - containerPort: 8080
          env:
            - name: APP_GREETING
              valueFrom:
                configMapKeyRef:
                  name: shop-config
                  key: APP_GREETNG
---
apiVersion: v1
kind: Service
metadata:
  name: shop
spec:
  selector:
    app: shop
  ports:
    - port: 80
      targetPort: 8081

# 실습 13 준비 — demo 의 로그 설정만 바꿉니다 (이미지 · 프로브 · 파드 수는 그대로)
#   kubectl patch deploy demo --patch-file labs/13-observe/demo-logging.yaml
# 앱을 다시 만들지 않고 Spring Boot 설정(환경 변수)만으로 켭니다. 파드가 하나씩 바뀝니다(실습 11 의 끊김 없는 교체).
spec:
  template:
    spec:
      containers:
        - name: demo
          env:
            # 어느 환경인가 — dev 프로필 (application-dev.yml) · 로그의 service.environment 칸에도 dev
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            # 앱 로그를 JSON 한 줄씩 (Spring Boot 3.4 · ECS 형식) — level · logger · message 가 칸으로 나뉨
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
              value: ecs
            - name: LOGGING_STRUCTURED_ECS_SERVICE_ENVIRONMENT
              value: dev
            # 잘못된 요청(예: POST)을 경고(WARN) 한 줄로 남김
            - name: SPRING_MVC_LOG_RESOLVED_EXCEPTION
              value: "true"
            # 요청마다 한 줄 (접근 로그) — 요청 헤더 X-Request-Id 를 requestId 칸에. 파일 대신 표준 출력으로
            - name: SERVER_TOMCAT_ACCESSLOG_ENABLED
              value: "true"
            - name: SERVER_TOMCAT_ACCESSLOG_DIRECTORY
              value: /dev
            - name: SERVER_TOMCAT_ACCESSLOG_PREFIX
              value: stdout
            - name: SERVER_TOMCAT_ACCESSLOG_SUFFIX
              value: ""
            - name: SERVER_TOMCAT_ACCESSLOG_FILE_DATE_FORMAT
              value: ""
            - name: SERVER_TOMCAT_ACCESSLOG_BUFFERED
              value: "false"
            - name: SERVER_TOMCAT_ACCESSLOG_PATTERN
              value: "level=info type=access requestId=%{X-Request-Id}i method=%m path=%U status=%s ms=%{ms}T"

# 실습 6. 밖에서 들어오는 입구 규칙 — 이 주소(host)로 오면 서비스 demo 로 보낸다
# host 는 압축을 받을 때 사람마다 이미 채워져 있다 (고치지 않는다)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo
spec:
  ingressClassName: traefik       # 이 규칙을 맡을 컨트롤러 (우리 클러스터의 입구)
  rules:
    - host: __HOST__
      http:
        paths:
          - path: /
            pathType: Prefix      # / 로 시작하는 모든 경로
            backend:
              service:
                name: TODO        # TODO: 1회차 실습 3 에서 만든 서비스 이름으로 바꾸세요
                port:
                  number: 80      # 서비스가 받는 포트 (파드의 8080 이 아니다)

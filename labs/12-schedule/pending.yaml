# 실습 12 ③. 고장 11 — 갈 노드가 없는 파드. 'disktype: ssd' 라벨이 붙은 노드로만 가라고 했다
apiVersion: v1
kind: Pod
metadata:
  name: picky
spec:
  terminationGracePeriodSeconds: 1
  nodeSelector:
    disktype: ssd                    # 이 라벨이 붙은 노드로만
  containers:
    - name: picky
      image: curlimages/curl:8.11.1
      command: ["sleep", "36000"]

# 실습 14. git 저장소(Gitea)의 app/templates/ingress.yaml 과 같은 내용 — 참고용 사본. 고치는 것은 브라우저의 Gitea 에서
# 2회차 실습 6 의 입구 규칙 demo. 값을 끼우는 자리는 주소 한 군데
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo
                port:
                  number: 80

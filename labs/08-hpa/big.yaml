# 실습 8. 2 코어를 예약하는 파드 — 노드 한 대가 2 코어인데, 들어갈까?
apiVersion: apps/v1
kind: Deployment
metadata:
  name: big
spec:
  replicas: 1
  selector:
    matchLabels:
      app: big
  template:
    metadata:
      labels:
        app: big
    spec:
      containers:
        - name: demo
          image: 844171074409.dkr.ecr.ap-northeast-2.amazonaws.com/k8s-study/demo-app:1.0
          resources:
            requests:
              cpu: "2"           # 2 코어 예약 (실제로 쓰는 양과 상관없이 자리를 잡는다)
              memory: 256Mi
            limits:
              cpu: "2"           # 칸의 기본 상한(cpu 1)보다 예약이 크면 파드가 아예 안 만들어지므로 상한도 같이 적는다
